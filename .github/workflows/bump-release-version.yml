name: Prepare release version

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semantic version part to increment
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: prepare-release-version
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6
        with:
          ref: master

      - name: Update version manifests
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
        run: node scripts/bump-version.mjs "$BUMP"

      - name: Commit release version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md package.json package-lock.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json
          git commit -m "Prepare release v${{ steps.bump.outputs.version }}"
          git push origin HEAD:master
